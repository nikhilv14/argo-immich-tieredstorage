# NOTE: the JSON must be the raw Grafana dashboard model (NOT the
# {"dashboard": {...}} import-API wrapper) for the sidecar to load it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-grafana-dashboard
  namespace: immich
  labels:
    grafana_dashboard: "1"
data:
  immich-dashboard.json: |
    {
      "title": "Immich Tiered Storage Resilience",
      "uid": "immich-tiered-storage",
      "tags": ["immich", "storage", "tiered"],
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "NAS Availability (library PVC Bound)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "max(kube_persistentvolumeclaim_status_phase{namespace=\"immich\", persistentvolumeclaim=\"immich-library\", phase=\"Bound\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "Available", "color": "green" }, "0": { "text": "Down", "color": "red" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Upload Queue Size (GB)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"immich\", persistentvolumeclaim=\"immich-upload\"} / 1e9"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "gigabytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 35 }, { "color": "red", "value": 40 } ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "SSD Cache Utilization (%)",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "100 * kubelet_volume_stats_used_bytes{namespace=\"immich\", persistentvolumeclaim=\"immich-cache\"} / kubelet_volume_stats_capacity_bytes{namespace=\"immich\", persistentvolumeclaim=\"immich-cache\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 } ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "NAS Library Size (GB)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"immich\", persistentvolumeclaim=\"immich-library\"} / 1e9"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "gigabytes" } }
        },
        {
          "id": 5,
          "title": "Database Size (GB)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"immich\", persistentvolumeclaim=\"immich-db-primary\"} / 1e9"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "gigabytes" } }
        },
        {
          "id": 6,
          "title": "Postgres Connections",
          "type": "timeseries",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 5 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "sum(pg_stat_activity_count{namespace=\"immich\"}) or sum(pg_stat_database_numbackends{datname=\"immich\"})"
            }
          ]
        },
        {
          "id": 7,
          "title": "immich-server Running",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "max(kube_pod_status_phase{namespace=\"immich\", pod=~\"immich-server-.*\", phase=\"Running\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "Running", "color": "green" }, "0": { "text": "Down", "color": "red" } } }
              ]
            }
          }
        },
        {
          "id": 8,
          "title": "DB Transactions/s",
          "type": "timeseries",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 5 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "rate(pg_stat_database_xact_commit{datname=\"immich\"}[$__rate_interval])"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 9,
          "title": "API Latency p95 (immich-server http)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_api_request_duration_seconds_bucket[$__rate_interval])))"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 10,
          "title": "immich-server CPU & Memory",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus" },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"immich\", pod=~\"immich-server-.*\"}[$__rate_interval])",
              "legendFormat": "cpu {{pod}}"
            },
            {
              "expr": "container_memory_working_set_bytes{namespace=\"immich\", pod=~\"immich-server-.*\"} / 1e9",
              "legendFormat": "mem {{pod}}"
            }
          ]
        }
      ]
    }
