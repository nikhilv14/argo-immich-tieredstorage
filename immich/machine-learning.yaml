apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      # No nodeSelector: ML pods may run on any node with the GPU feature label
      # (required via nodeAffinity below); all nodes are labeled gpu=true.

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: immich-machine-learning

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values:
                      - "true"

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [109, 44] # 109 is 'render'and 44 is group ID

      containers:
        - name: immich-machine-learning
          # -openvino variant: ships onnxruntime OpenVINO EP for iGPU inference
          # pinned to v3.3.1 to match immich-server v3.3.1
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.1-openvino
          imagePullPolicy: IfNotPresent
          # GPU via Intel device plugin: advertises gpu.intel.com/i915, mounts
          # /dev/dri and fixes the cgroup-v2 device filter (privileged cannot)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              gpu.intel.com/i915: "1"
          # Level Zero loader + GPU driver live on the host, not in the image
          env:
            # ENABLE OPENVINO
            - name: ACCELERATORS
              value: "openvino"
            - name: NODE_ENV
              value: "production"
            - name: MACHINE_LEARNING_DEVICE
              value: "GPU"
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: "/cache"
            - name: TRANSFORMERS_CACHE
              value: "/cache"
            # Override immich-config's IMMICH_PORT=2283 (shared by server+ML via envFrom):
            # ML must bind 3003 to match the Service, without touching the server's port.
            - name: IMMICH_PORT
              value: "3003"
            - name: MPLCONFIGDIR
              value: "/cache/matplotlib"
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          ports:
            - containerPort: 3003
              name: http
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: dev-dri
              mountPath: /dev/dri
            - name: ze-loader
              mountPath: /usr/lib/x86_64-linux-gnu/libze_loader.so.1
            - name: ze-gpu-driver
              mountPath: /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1
      volumes:
        - name: model-cache
          emptyDir: {}  # or use a PVC if you want to persist downloaded models
        - name: dev-dri
          hostPath:
            path: /dev/dri
        - name: ze-loader
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libze_loader.so.1
            type: File
        - name: ze-gpu-driver
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1
            type: File

---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
