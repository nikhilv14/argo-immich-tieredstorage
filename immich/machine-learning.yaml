apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      # Tiered scheduling via node tags (see label-ml-nodes.sh):
      #   tier=1  k3s-node1        (UHD770)
      #   tier=1  k3s-server-nuc   (UHD660)
      #   tier=1  k3s-worker-z690  (UHD770)
      #   tier=2  k3s-server-hp-g9 (no iGPU, CPU-only, LAST priority)
      # The gpu.intel.com/i915 limit below is the hard gate: only nodes
      # advertising that extended resource (the 3 tier=1 nodes via the Intel
      # device plugin) can actually accept a pod. tier=2 stays eligible on
      # paper as the last-resort fallback, but a pod can only land there if
      # the i915 limit is dropped.

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: immich-machine-learning

      affinity:
        nodeAffinity:
          # HARD requirement: either a tagged ML tier node, or (pre-tagging
          # grace) any node the Intel device plugin has GPU-labeled. hp-g9 is
          # naturally excluded from the second term: it has no iGPU, so the
          # device plugin never labels it.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: immich.ml/tier
                    operator: In
                    values: ["1", "2"]
              - matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values: ["true"]
          # SOFT preference: tier=1 GPU nodes win by a landslide. A tier=2
          # (CPU) node is only ever picked when no tier=1 node is feasible.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: immich.ml/tier
                    operator: In
                    values: ["1"]
            - weight: 10
              preference:
                matchExpressions:
                  - key: immich.ml/tier
                    operator: In
                    values: ["2"]
        podAntiAffinity:
          # Spread replicas across nodes so each iGPU serves at most one ML
          # pod. Soft: the i915 limit (1 device per GPU node) already enforces
          # this, so do not hard-block rescheduling if a GPU node goes down.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: immich-machine-learning

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [109, 44] # 109 is 'render'and 44 is group ID

      # ML never calls the Kubernetes API. Skipping the projected service-account
      # token avoids a tmpfs mount that unprivileged LXC nodes (k3s-worker-z690)
      # cannot perform: root there lacks CAP_SYS_ADMIN over the host mount ns,
      # so kubelet volume mounts fail with "must be superuser".
      automountServiceAccountToken: false

      containers:
        - name: immich-machine-learning
          # -openvino variant: ships onnxruntime OpenVINO EP for iGPU inference
          # pinned to v3.3.1 to match immich-server v3.3.1
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.1-openvino
          imagePullPolicy: IfNotPresent
          # GPU via Intel device plugin: advertises gpu.intel.com/i915, mounts
          # /dev/dri and fixes the cgroup-v2 device filter (privileged cannot)
          # Each tier=1 node exposes 1 i915 device, so this hard limit pins the
          # ML replica ceiling to 3 (one pod per iGPU) and keeps CPU (hp-g9)
          # out of the GPU pool entirely.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              gpu.intel.com/i915: "1"
          # Level Zero loader + GPU driver live on the host, not in the image
          env:
            # ENABLE OPENVINO
            - name: ACCELERATORS
              value: "openvino"
            - name: NODE_ENV
              value: "production"
            - name: MACHINE_LEARNING_DEVICE
              value: "GPU"
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: "/cache"
            - name: TRANSFORMERS_CACHE
              value: "/cache"
            # Override immich-config's IMMICH_PORT=2283 (shared by server+ML via envFrom):
            # ML must bind 3003 to match the Service, without touching the server's port.
            - name: IMMICH_PORT
              value: "3003"
            - name: MPLCONFIGDIR
              value: "/cache/matplotlib"
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          ports:
            - containerPort: 3003
              name: http
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: ze-loader
              mountPath: /usr/lib/x86_64-linux-gnu/libze_loader.so.1
            - name: ze-gpu-driver
              mountPath: /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1
      volumes:
        - name: model-cache
          emptyDir: {}  # or use a PVC if you want to persist downloaded models
        # NOTE: no /dev/dri hostPath. The Intel GPU device plugin injects the
        # render node(s) into containers that request gpu.intel.com/i915, and
        # a whole-dir bind mount of /dev/dri breaks container spec generation
        # on k3s-worker-z690 (unprivileged LXC): mkdir of the dangling
        # /dev/dri/by-path card symlink inside the mounted dir returns EEXIST.
        - name: ze-loader
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libze_loader.so.1
            type: File
        - name: ze-gpu-driver
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libze_intel_gpu.so.1
            type: File

---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
