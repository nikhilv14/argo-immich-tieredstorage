apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-ml-hpa
  namespace: immich
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-machine-learning
  # Replica ceiling is REAL GPU capacity: only the two tier=1 nodes advertise
  # gpu.intel.com/i915 (k3s-node1 UHD770, k3s-server-nuc). hp-g9 also has a
  # UHD770 but that iGPU is assigned to an LXC guest, NOT to the k3s-server VM,
  # so it will never register i915 allocatable there. hp-g9 keeps tier=2 +
  # intel gpu=true as the CPU-only fallback and is not an autoscaling target.
  # Every replica claims i915: 1, so max must equal the allocatable slot count:
  # anything higher schedules a replica that can never bind (permanent Pending
  # pod -> KubePodNotReady page). Raise this only if a new node advertises i915.
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        # averageValue (absolute) instead of Utilization: onnxruntime never
        # returns model memory to the OS after unload (arena caching), so RSS
        # idles at ~280Mi avg vs the 512Mi request. At an 80% Utilization
        # target that pins desired = ceil(3 * 54/80) = 3 forever — the fleet
        # could never scale back to 1 while idle. With 1Gi, idle avg is ~27%
        # -> desired 1; bursts still scale up via the CPU 75% target, and
        # memory only triggers scaling if the fleet truly exceeds ~1Gi avg.
        target:
          type: AverageValue
          averageValue: 1Gi
  behavior:
    scaleUp:
      # Fill GPU slots quickly during burst jobs (smart-search / face detection)
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      # Be conservative: model load into the GPU is expensive, avoid flapping
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
