apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-ml-hpa
  namespace: immich
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-machine-learning
  # Replica ceiling is REAL GPU capacity: only the two tier=1 nodes advertise
  # gpu.intel.com/i915 (k3s-node1 UHD770, k3s-server-nuc). hp-g9 also has a
  # UHD770 but that iGPU is assigned to an LXC guest, NOT to the k3s-server VM,
  # so it will never register i915 allocatable there. hp-g9 keeps tier=2 +
  # intel gpu=true as the CPU-only fallback and is not an autoscaling target.
  # Every replica claims i915: 1, so max must equal the allocatable slot count:
  # anything higher schedules a replica that can never bind (permanent Pending
  # pod -> KubePodNotReady page). Raise this only if a new node advertises i915.
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        # averageValue (absolute) instead of Utilization: onnxruntime never
        # returns model memory to the OS after unload (arena caching), so RSS
        # stays high while idle. The old 1Gi target was set when idle avg was
        # ~280Mi; after the PP-OCRv5 OCR models were added, idle RSS is ~1.2-
        # 1.6Gi per pod (2.8Gi fleet), which pinned desired replicas at max
        # even with CPU at 1% and made KubeHpaMaxedOut permanent noise.
        # 3Gi is above the idle fleet sum (scales back to 1) but below burst
        # RSS (peaks 4.5Gi per pod in the last 6h), so real face/OCR jobs
        # still fill both GPU slots and the alert only fires when warranted.
        target:
          type: AverageValue
          averageValue: 3Gi
  behavior:
    scaleUp:
      # Fill GPU slots quickly during burst jobs (smart-search / face detection)
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      # Be conservative: model load into the GPU is expensive, avoid flapping
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
