apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-ml-hpa
  namespace: immich
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-machine-learning
  # Replica ceiling is REAL GPU capacity: only the two tier=1 nodes advertise
  # gpu.intel.com/i915 (k3s-node1 UHD770, k3s-server-nuc). hp-g9 carries
  # tier=2 and intel gpu=true but registers no i915 allocatable, so it is the
  # CPU-only fallback and cannot host a GPU replica. Every replica claims
  # i915: 1, so a 3rd replica is unschedulable forever -> permanent Pending pod
  # and a KubePodNotReady page. Keep max at the number of allocatable slots and
  # bump it only when hp-g9 actually advertises i915.
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        # averageValue (absolute) instead of Utilization: onnxruntime never
        # returns model memory to the OS after unload (arena caching), so RSS
        # idles at ~280Mi avg vs the 512Mi request. At an 80% Utilization
        # target that pins desired = ceil(3 * 54/80) = 3 forever — the fleet
        # could never scale back to 1 while idle. With 1Gi, idle avg is ~27%
        # -> desired 1; bursts still scale up via the CPU 75% target, and
        # memory only triggers scaling if the fleet truly exceeds ~1Gi avg.
        target:
          type: AverageValue
          averageValue: 1Gi
  behavior:
    scaleUp:
      # Fill GPU slots quickly during burst jobs (smart-search / face detection)
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      # Be conservative: model load into the GPU is expensive, avoid flapping
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
