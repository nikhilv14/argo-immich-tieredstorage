apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immich-ml-hpa
  namespace: immich
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immich-machine-learning
  # Replica ceiling is GPU capacity: 3 tier=1 nodes x 1 iGPU each (UHD770,
  # UHD660, UHD770). Every replica claims gpu.intel.com/i915: 1, so scaling
  # past 3 would only ever produce Pending pods (hp-g9 is CPU-only and is the
  # last-priority fallback, not an autoscaling target).
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        # averageValue (absolute) instead of Utilization: onnxruntime never
        # returns model memory to the OS after unload (arena caching), so RSS
        # idles at ~280Mi avg vs the 512Mi request. At an 80% Utilization
        # target that pins desired = ceil(3 * 54/80) = 3 forever — the fleet
        # could never scale back to 1 while idle. With 1Gi, idle avg is ~27%
        # -> desired 1; bursts still scale up via the CPU 75% target, and
        # memory only triggers scaling if the fleet truly exceeds ~1Gi avg.
        target:
          type: AverageValue
          averageValue: 1Gi
  behavior:
    scaleUp:
      # Fill GPU slots quickly during burst jobs (smart-search / face detection)
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
    scaleDown:
      # Be conservative: model load into the GPU is expensive, avoid flapping
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
