apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning-cpu
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-machine-learning
    app.kubernetes.io/variant: cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
      app.kubernetes.io/variant: cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
        app.kubernetes.io/variant: cpu
    spec:
      # Pin to the idle 12600 (WSL). Service immich-machine-learning selects
      # both this and the GPU variant, load-balancing across nodes; when WSL
      # sleeps, the readiness probe drops this endpoint and all traffic
      # fails over to the GPU pod on k3s-node1.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - wsl2-debian-worker
      tolerations:
        - key: intermittent
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: immich-machine-learning
          # plain (non-openvino) image: no /dev/dri on WSL, CPU-only inference
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MPLCONFIGDIR
              value: "/cache/matplotlib"
          envFrom:
            - configMapRef:
                name: immich-config
            - secretRef:
                name: immich-secret
          ports:
            - containerPort: 2283
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: 2283
            periodSeconds: 15
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # 12600 has 10c/16t; leave headroom for Windows + this agent
              cpu: "8"
              memory: 6Gi
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
