apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  # app label is the selector the ServiceMonitor (monitoring/servicemonitor.yaml) matches on
  labels:
    app: immich-server
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - protocol: TCP
      port: 2283
      targetPort: 2283
    # Prometheus telemetry: enabled via IMMICH_TELEMETRY_INCLUDE in server-deployment.yaml
    - name: metrics
      protocol: TCP
      port: 8081
      targetPort: 8081
