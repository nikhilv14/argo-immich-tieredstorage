# storage/redis-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-redis
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: pvc-41446236-5d5b-4eac-b0b1-47cbdae49269
  storageClassName: truenas-iscsi # TrueNAS iSCSI via democratic-csi
  resources:
    requests:
      storage: 2Gi

