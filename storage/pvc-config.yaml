apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-primary
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  # Pinned to the live democratic-csi (TrueNAS iSCSI) PV. VolumeName is set
  # because the claim pre-binds to that specific PV; required so ArgoCD stays
  # in sync. See database/README-db-affinity.md for node placement notes.
  volumeName: pvc-dab66f83-afb5-492d-abb1-139a3c5bd67e
  resources:
    requests:
      storage: 20Gi

